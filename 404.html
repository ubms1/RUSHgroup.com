<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    // Served for missing addresses at any depth, so links resolve from the site root
    // (the repository folder on a github.io project site, otherwise the domain root).
    (function () {
      var seg = location.pathname.split('/')[1];
      var base = /\.github\.io$/.test(location.hostname) && seg ? '/' + seg + '/' : '/';
      document.head.appendChild(Object.assign(document.createElement('base'), { href: base }));
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d4f91">
  <meta name="robots" content="noindex">
  <title>Page not found · RUSH</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="site.css">
</head>
<body data-page="notfound">
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-head" data-site-head></header>

  <main id="main">
    <section class="hero" aria-labelledby="page-title">
      <div class="wrap">
        <div>
          <p class="eyebrow">Error 404</p>
          <h1 id="page-title">We could not find that page</h1>
          <p class="lead">The address may be mistyped, or the page may have moved. Start again from the RUSH home page, or get the RUSH apps from Google Play and the App Store.</p>
          <div class="btn-row">
            <a class="btn btn-light" href="index.html">Go to the RUSH home page</a>
            <a class="btn btn-outline-light" href="apps.html">Get the RUSH apps</a>
          </div>
        </div>
        <div class="hero-card">
          <img src="assets/rush-logo.png" alt="RUSH, Everything, Delivered" width="300" height="300">
          <p>One account for every RUSH service.</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-foot" data-site-foot></footer>
  <script src="config.js"></script>
  <script src="assets/rush-icons.js"></script>
  <script src="site.js"></script>
</body>
</html>
